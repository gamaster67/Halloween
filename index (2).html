<title>Podmena-arkivet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#d8d3c3;
  --ink-page:#23211b;
  --ink-page-dim:#5c584a;
  --paper:#f2ecdb;
  --paper-edge:#d9d0b4;
  --ink:#1c1a13;
  --ink-dim:#6b6653;
  --rule:#c7bd9d;
  --redacted:#131109;
  --monster:#7d2119;
  --monster-soft:#f1e2df;
  --jeger:#33513c;
  --jeger-soft:#e1ece3;
  --focus:#a3341f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0a0b09;
    --ink-page:#d8d3c0;
    --ink-page-dim:#8b8672;
    --monster:#8a2a20;
    --jeger:#3a5c44;
    --focus:#c2492f;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a0b09;
  --ink-page:#d8d3c0;
  --ink-page-dim:#8b8672;
  --monster:#8a2a20;
  --jeger:#3a5c44;
  --focus:#c2492f;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink-page);font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;}
.wrap{max-width:640px;margin:0 auto;padding-inline:20px;padding-block:40px 64px;}
.eyebrow{font-family:"Oswald",sans-serif;font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:var(--ink-page-dim);text-align:center;margin:0 0 8px;}
h1.title{font-family:"Oswald",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:clamp(26px,6vw,38px);text-align:center;margin:0 0 28px;text-wrap:balance;color:var(--ink-page);}
.folder{background:var(--paper);color:var(--ink);border:1px solid var(--paper-edge);border-radius:2px;box-shadow:0 18px 40px -20px rgba(0,0,0,.55),0 2px 0 var(--paper-edge);position:relative;padding:28px 24px 32px;}
.folder::before{content:"";position:absolute;left:24px;top:-14px;width:120px;height:16px;background:var(--paper);border:1px solid var(--paper-edge);border-bottom:none;border-radius:3px 3px 0 0;}
.tab-label{position:absolute;left:32px;top:-11px;font-family:"Oswald",sans-serif;font-size:9px;letter-spacing:.14em;color:var(--ink-dim);text-transform:uppercase;}
.redact{display:block;height:11px;background:var(--redacted);border-radius:1px;margin:8px 0;}
.redact.w60{width:60%}
.redact.w80{width:80%}
.redact.w40{width:40%}
.redact.w90{width:90%}
.body-copy{font-size:14.5px;line-height:1.65;color:var(--ink);margin:0 0 18px;}
.body-copy strong{color:var(--ink);}
.rule{border:none;border-top:1px dashed var(--rule);margin:20px 0;}
.stamp{font-family:"Oswald",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:22px;display:inline-block;padding:8px 18px;border:3px solid currentColor;border-radius:3px;transform:rotate(-3deg);margin:6px 0 18px;}
.stamp.monster{color:var(--monster);}
.stamp.jeger{color:var(--jeger);}
.field{margin-bottom:18px;}
.field label{display:block;font-family:"Oswald",sans-serif;font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px;}
.field .hint{font-size:12px;color:var(--ink-dim);margin:2px 0 6px;font-style:italic;}
input[type=text],textarea{width:100%;font-family:"IBM Plex Mono",monospace;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--paper-edge);border-radius:3px;padding:10px 12px;resize:vertical;}
textarea{min-height:64px;line-height:1.5;}
input[type=text]:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:1px;}
button{font-family:"Oswald",sans-serif;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px;cursor:pointer;border-radius:3px;border:1px solid transparent;padding:12px 20px;}
.btn-primary{background:var(--ink);color:var(--paper);width:100%;}
.btn-primary:hover{opacity:.88;}
.btn-ghost{background:transparent;border:1px solid var(--ink-dim);color:var(--ink);}
.btn-small{font-size:11px;padding:7px 12px;}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;}
.note{font-size:12.5px;color:var(--ink-dim);text-align:center;margin-top:16px;line-height:1.5;}
.footer{text-align:center;font-size:11px;color:var(--ink-page-dim);margin-top:28px;letter-spacing:.04em;}
.gm-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px;}
.gm-table th,.gm-table td{border-bottom:1px solid var(--paper-edge);padding:8px 6px;text-align:left;vertical-align:middle;}
.gm-table th{font-family:"Oswald",sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);}
.role-pill{display:inline-block;font-family:"Oswald",sans-serif;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:20px;}
.role-pill.monster{background:var(--monster-soft);color:var(--monster);}
.role-pill.jeger{background:var(--jeger-soft);color:var(--jeger);}
.url-box{display:flex;gap:8px;align-items:center;}
.url-box input{font-size:11px;flex:1;}
.gate{max-width:340px;margin:0 auto;text-align:center;}
.gate input{text-align:center;letter-spacing:.1em;text-transform:uppercase;}
.toast{display:inline-block;margin-left:8px;font-size:12px;color:var(--jeger);}
@media (max-width:420px){
  .folder{padding:22px 16px 26px;}
  .gm-table{font-size:12px;}
  .url-box input{font-size:10px;}
}
</style>
<div class="wrap" id="app"></div>
<script>
(function(){
  var SLOTS = [
    {id:'isbrudd',   role:'monster'},
    {id:'vokteren',  role:'jeger'},
    {id:'askefall',  role:'monster'},
    {id:'nattfrost', role:'jeger'},
    {id:'gravro',     role:'jeger'},
    {id:'kaldblod',  role:'monster'}
  ];
  var PASSCODE = 'PODMENA';

  var MONSTER_FIELDS = [
    {key:'utside', label:'Utsiden', hint:'Hvem tror alle andre at du er? Navn, yrke, hvordan du virker fra utsiden. (Dette kan inkludere class, rase, osv, men bare send det til meg seperat uansett)'},
    {key:'sannhet', label:'Sannheten', hint:'Hva er du egentlig, under overflaten? Hvilket type monstrøst beist er du.'},
    {key:'sprekk', label:'Svakhet', hint:'Hva er svakheten din? (kulde, stress, et syn, lyd eller ord)'},
    {key:'frykt', label:'Styrken', hint:'Hvordan skal du unngå at folk finner ut av hva du er?'}
  ];
  var JEGER_FIELDS = [
    {key:'motiv', label:'Motivet', hint:'Hvorfor jakter du dette monsteret? (i tillegg til sånn hvem du er og sånn, men regner med at jeg får et character sheet etterhvert)'},
    {key:'grense', label:'Grensen', hint:'Hvor langt er du villig til å gå for å fullføre oppdraget?'},
    {key:'skam', label:'Skammen', hint:'Hva gjør det mest ukomfortabel?'},
    {key:'historie', label:'Historien', hint:'Hva er historien din med monstre?'}
  ];

  function lsGet(key){
    try{ var v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
    catch(e){ return null; }
  }
  function lsSet(key,val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
  }
  function getSlot(id){
    var norm = String(id||'').toLowerCase();
    for(var i=0;i<SLOTS.length;i++){ if(SLOTS[i].id===norm) return SLOTS[i]; }
    return null;
  }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function baseUrl(){
    return location.origin + location.pathname;
  }
  function copyText(text, btn){
    var orig = btn.textContent;
    function ok(){ btn.textContent='Kopiert'; setTimeout(function(){btn.textContent=orig;},1500); }
    function fail(){
      try{
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.focus(); ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        ok();
      }catch(e){ btn.textContent='Merk teksten manuelt'; setTimeout(function(){btn.textContent=orig;},1800); }
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(ok, fail);
    } else { fail(); }
  }

  var app = document.getElementById('app');

  function render(){
    var hash = decodeURIComponent(location.hash.replace('#',''));
    if(hash.toLowerCase() === 'spilleder'){ renderGM(); return; }
    var slot = getSlot(hash);
    if(slot){ renderPlayer(slot); return; }
    renderCover();
  }

  function renderCover(){
    app.innerHTML =
      '<p class="eyebrow">Verdens Ende &middot; Halloween-spesial</p>' +
      '<h1 class="title">Podmena-arkivet</h1>' +
      '<div class="folder">' +
        '<span class="tab-label">Uidentifisert mappe</span>' +
        '<span class="redact w60"></span><span class="redact w90"></span><span class="redact w40"></span>' +
        '<p class="body-copy" style="margin-top:18px">Denne siden er personlig. Du trenger lenken gaymaster ga deg.</p>' +
        '<p class="body-copy">Har du ikke fått en lenke ennå, spør gaymaster. Bare gi meg beskjed om nettsiden ikke funker, jeg er ikke veldig god på dette og brukte bare en mal fra reddit.</p>' +
      '</div>' +
      '<p class="footer">Bare gi meg beskjed om nettsiden ikke funker, jeg er ikke veldig god på dette og brukte bare en mal fra reddit.</p>';
  }

  function renderPlayer(slot){
    var key = 'podmena_' + slot.id;
    var data = lsGet(key) || {revealed:false, name:'', answers:{}};

    if(!data.revealed){
      app.innerHTML =
        '<p class="eyebrow">Verdens Ende &middot; Halloween-spesial</p>' +
        '<h1 class="title">Podmena-arkivet</h1>' +
        '<div class="folder">' +
          '<span class="tab-label">Personalmappe</span>' +
          '<span class="redact w80"></span><span class="redact w60"></span><span class="redact w90"></span><span class="redact w40"></span>' +
          '<p class="body-copy" style="margin-top:18px">Et nedlagt anlegg, gravd inn i isen. Bygget i hemmelighet under en tidligere krig, offisielt glemt av historien.</p>' +
          '<p class="body-copy">Denne mappen er hemmelig. Ingen andre skal se hva den inneholder.</p>' +
          '<div class="field">' +
            '<label for="pname">Navn (for mr oscar den kuleste og beste)</label>' +
            '<input type="text" id="pname" value="' + esc(data.name) + '" placeholder="Skriv navnet ditt">' +
          '</div>' +
          '<button class="btn-primary" id="revealBtn">Åpne mappen</button>' +
        '</div>' +
        '<p class="footer">Bare gi meg beskjed om nettsiden ikke funker, jeg er ikke veldig god på dette og brukte bare en mal fra reddit.</p>';
      document.getElementById('revealBtn').addEventListener('click', function(){
        var name = document.getElementById('pname').value.trim();
        data.name = name;
        data.revealed = true;
        lsSet(key, data);
        renderPlayer(slot);
      });
      return;
    }

    var isMonster = slot.role === 'monster';
    var fields = isMonster ? MONSTER_FIELDS : JEGER_FIELDS;
    var stampText = isMonster ? 'Podmena-subjekt' : 'Jeger';
    var stampClass = isMonster ? 'monster' : 'jeger';
    var flavor = isMonster
      ? 'Du er et monster, skjult bak fasaden av en annen rase.<br><br>Du er ikke sulten på de andre ved dette bordet. Sulten din drar deg mot anlegget du ble skapt i, og mot dem som jobber der.'
      : 'Du er en monsterjeger. Du vet hva et Podmena-subjekt er, og du vet at det kan se ut som hvem som helst i dette rommet.<br><br>Hvor langt du er villig til å gå for å finne og drepe monstrene er opp til deg. Men vær forsiktig, noen av dem kan bite tilbake.';

    var fieldsHtml = fields.map(function(f){
      var val = (data.answers && data.answers[f.key]) || '';
      return '<div class="field">' +
        '<label for="f_' + f.key + '">' + esc(f.label) + '</label>' +
        '<p class="hint">' + esc(f.hint) + '</p>' +
        '<textarea id="f_' + f.key + '" data-key="' + f.key + '">' + esc(val) + '</textarea>' +
      '</div>';
    }).join('');

    app.innerHTML =
      '<p class="eyebrow">Verdens Ende &middot; Halloween-spesial</p>' +
      '<h1 class="title">Podmena-arkivet</h1>' +
      '<div class="folder">' +
        '<span class="tab-label">Personalmappe</span>' +
        '<div class="stamp ' + stampClass + '">' + esc(stampText) + '</div>' +
        '<p class="body-copy">' + flavor + '</p>' +
        '<hr class="rule">' +
        '<div class="field">' +
          '<label for="pname2">Navn (for spillederen din)</label>' +
          '<input type="text" id="pname2" value="' + esc(data.name) + '" placeholder="Skriv navnet ditt">' +
        '</div>' +
        fieldsHtml +
        '<div class="actions">' +
          '<button class="btn-primary" id="copyBtn" style="flex:1 1 auto;">Kopier svar til spillederen</button>' +
        '</div>' +
        '<p class="note">Skriv det du vil. Teksten lagres til du kopierer og sender den selv. Ikke vis skjermen din til noen av de andre spillerne.</p>' +
      '</div>' +
      '<p class="footer">Podmena-arkivet</p>';

    var pname2 = document.getElementById('pname2');
    pname2.addEventListener('input', function(){
      data.name = pname2.value;
      lsSet(key, data);
    });
    fields.forEach(function(f){
      var el = document.getElementById('f_' + f.key);
      el.addEventListener('input', function(){
        data.answers = data.answers || {};
        data.answers[f.key] = el.value;
        lsSet(key, data);
      });
    });
    document.getElementById('copyBtn').addEventListener('click', function(btnEvt){
      var lines = [];
      lines.push('[PODMENA-ARKIVET // PRIVAT]');
      lines.push('Spiller: ' + (data.name || '(uten navn)'));
      lines.push('Rolle: ' + (isMonster ? 'MONSTER' : 'JEGER'));
      fields.forEach(function(f){
        lines.push(esc_plain(f.label) + ': ' + ((data.answers && data.answers[f.key]) || '(ikke fylt ut)'));
      });
      copyText(lines.join('\n'), btnEvt.currentTarget);
    });
  }

  function esc_plain(s){ return String(s==null?'':s); }

  function renderGM(){
    var unlocked = sessionStorage.getItem('podmena_gm_ok') === '1';
    if(!unlocked){
      app.innerHTML =
        '<p class="eyebrow">Spillederinngang</p>' +
        '<h1 class="title">Podmena-arkivet</h1>' +
        '<div class="folder gate">' +
          '<p class="body-copy">Skriv kodeordet for å se sporoversikten.</p>' +
          '<div class="field"><input type="text" id="pass" placeholder="Kodeord"></div>' +
          '<button class="btn-primary" id="passBtn">Lås opp</button>' +
          '<p class="note" id="passErr" style="color:var(--monster);display:none;">Feil kodeord.</p>' +
        '</div>';
      document.getElementById('passBtn').addEventListener('click', tryPass);
      document.getElementById('pass').addEventListener('keydown', function(e){ if(e.key==='Enter') tryPass(); });
      return;
    }
    var rows = SLOTS.map(function(s){
      var url = baseUrl() + '#' + s.id;
      return '<tr>' +
        '<td>' + s.id + '</td>' +
        '<td><span class="role-pill ' + s.role + '">' + (s.role==='monster'?'Monster':'Jeger') + '</span></td>' +
        '<td><div class="url-box"><input type="text" readonly value="' + url + '" id="url_' + s.id + '"><button class="btn-ghost btn-small" data-url="' + url + '">Kopier</button></div></td>' +
      '</tr>';
    }).join('');
    app.innerHTML =
      '<p class="eyebrow">Spillederinngang</p>' +
      '<h1 class="title">Podmena-arkivet</h1>' +
      '<div class="folder">' +
        '<span class="tab-label">Sporoversikt</span>' +
        '<p class="body-copy">6 forhåndsdelte kodeord, 3 Monster og 3 Jeger. Del ut 4 eller 5 av dem etter hvor mange som stiller &mdash; velg selv hvilke for å styre balansen (f.eks. 2 Monster / 2 Jeger ved 4 spillere). Kodeordene er ikke fortløpende, så ingen kan gjette seg til en annens ved å prøve naboverdier i adressefeltet.</p>' +
        '<table class="gm-table"><thead><tr><th>Kodeord</th><th>Rolle</th><th>Lenke</th></tr></thead><tbody>' + rows + '</tbody></table>' +
        '<p class="note">Hver lenke viser samme rolle hver gang den åpnes, også etter en omstart av siden. Svarene spillerne skriver inn lagres kun i deres egen nettleser &mdash; de kopierer og sender dem til deg selv.</p>' +
      '</div>' +
      '<p class="footer">Ikke del denne siden med spillerne</p>';
    Array.prototype.forEach.call(document.querySelectorAll('[data-url]'), function(btn){
      btn.addEventListener('click', function(){
        copyText(btn.getAttribute('data-url'), btn);
      });
    });
  }

  function tryPass(){
    var v = document.getElementById('pass').value.trim().toUpperCase();
    if(v === PASSCODE){
      sessionStorage.setItem('podmena_gm_ok','1');
      renderGM();
    } else {
      document.getElementById('passErr').style.display = 'block';
    }
  }

  window.addEventListener('hashchange', render);
  render();
})();
</script>
